[project]
name = "jobtailor"
version = "0.1.0"
description = "Tailor resume accomplishments to a target job description and emit a .docx"
readme = "README.md"
# Pin below 3.14 for now: the reserved deps (pymupdf, selectolax) don't yet ship
# wheels for 3.14. uv will fetch a compatible interpreter automatically.
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",       # typed models + validation (like C# records + DataAnnotations)
    "typer>=0.12",         # CLI framework (like System.CommandLine)
    "python-docx>=1.1",    # writes the .docx output
    "anthropic>=0.40",     # Claude API client
    "pyyaml>=6.0",         # reads profile.yaml (import name is `yaml`)
    "python-dotenv>=1.0",  # loads secrets from .env
    "httpx>=0.27",         # reserved for the LinkedIn ingester (unused for now)
    "selectolax>=0.3",     # reserved for the LinkedIn ingester (unused for now)
    "pymupdf>=1.24",       # reserved for the PDF bootstrap tool (unused for now)
]

# This registers the `jobtailor` command. It points at the Typer app object in
# cli.py; a Typer instance is callable, so it works as a console-script target.
[project.scripts]
jobtailor = "jobtailor.cli:app"

# Dev-only dependencies, installed by `uv sync` but not shipped.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell the build backend where the importable package lives.
[tool.hatch.build.targets.wheel]
packages = ["src/jobtailor"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes (F) + a subset of pycodestyle (E) + import sorting (I) +
# pyupgrade (UP) + flake8-pie (PIE). B008 is excluded because typer's idiom is
# to call typer.Option(...) in argument defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "PIE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
